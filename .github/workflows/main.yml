name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to query (YYYY-MM-DD)'
        required: false
        type: string
  schedule:
    - cron: '0 22 * * *'

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install local LLM extra
        if: ${{ secrets.USE_LLM_API == '1' }}
        run: uv sync --extra local-llm

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          ARXIV_QUERY: ${{ secrets.ARXIV_QUERY }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
          USE_LLM_API: ${{ secrets.USE_LLM_API }}
          LOCAL_LLM_MAX_SECONDS: ${{ vars.LOCAL_LLM_MAX_SECONDS }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          if [ -n "${{ inputs.date }}" ]; then
            uv run src/zotero_arxiv_daily/main.py source.arxiv.query_date="${{ inputs.date }}"
          else
            uv run src/zotero_arxiv_daily/main.py
          fi
